<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYGIENE PROTOCOL // MONSTER MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ef4444">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-[#07090f] text-slate-100 min-h-screen selection:bg-red-500 selection:text-white pb-16">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-[#0c101d]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <span class="text-xl">🧼</span>
                <h1 class="font-orbitron font-extrabold tracking-wider text-sm sm:text-base text-red-500">HYGIENE PROTOCOL</h1>
            </div>
            <div class="flex items-center space-x-2.5">
                <div id="xp-badge" class="px-2.5 py-1 bg-red-500/10 border border-red-500/30 rounded-lg text-xs font-orbitron font-bold text-red-400">
                    ⚡ 0 XP
                </div>
                <button onclick="window.location.href='dashboard.html'" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition border border-slate-700">
                    Dashboard
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-5">

        <!-- Header Banner & Date Picker -->
        <div class="bg-[#121520] border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h2 class="font-orbitron font-bold text-lg text-white">Daily Purity Status</h2>
                <p class="text-xs text-slate-400 mt-0.5">Discipline in cleanliness builds an iron mind.</p>
            </div>
            <div>
                <input type="date" id="target-date" onchange="loadHygieneData()" class="bg-[#07090f] border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-red-500 font-orbitron">
            </div>
        </div>

        <!-- Add Task Form Box -->
        <div class="bg-[#121520] border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h3 class="font-orbitron font-bold text-xs text-red-400 mb-3 uppercase tracking-wider">➕ Add New Hygiene Task</h3>
            <form id="add-task-form" onsubmit="addHygieneTask(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <input type="text" id="task-name" placeholder="Task Name (e.g. Cold Shower)" required class="bg-[#07090f] border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-red-500">
                <select id="task-frequency" class="bg-[#07090f] border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-red-500 font-orbitron">
                    <option value="daily">Daily Task</option>
                    <option value="sunday">Sunday Special</option>
                </select>
                <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-orbitron font-bold text-xs uppercase tracking-wider py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition cursor-pointer">
                    Add Task
                </button>
            </form>
        </div>

        <!-- Tasks List Container -->
        <div class="bg-[#121520] border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800/60">
                <h3 class="font-orbitron font-bold text-xs text-slate-300 uppercase tracking-wider">📋 Protocols List</h3>
                <span id="completion-status" class="text-xs font-orbitron font-bold text-slate-400">0 / 0 Completed</span>
            </div>
            <div id="tasks-container" class="space-y-2.5">
                <div class="text-center py-6 text-xs text-slate-500 font-orbitron animate-pulse">LOADING...</div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        async function loadHygieneData() {
            const dateInput = document.getElementById('target-date').value;
            try {
                const res = await fetch(`/api/hygiene${dateInput ? '?date=' + dateInput : ''}`);
                const data = await res.json();
                
                if (data.success) {
                    if (!dateInput && data.serverDate) {
                        document.getElementById('target-date').value = data.serverDate;
                    }
                    
                    if (data.level !== undefined) {
                        document.getElementById('xp-badge').innerText = `⚡ LVL ${data.level} (${data.xp} XP)`;
                    }

                    const container = document.getElementById('tasks-container');
                    container.innerHTML = '';

                    const tasks = data.applicableTasks || [];
                    const completedCount = tasks.filter(t => t.completed).length;
                    document.getElementById('completion-status').innerText = `${completedCount} / ${tasks.length} Completed`;

                    if (tasks.length === 0) {
                        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-500 font-orbitron">No hygiene tasks found for this date.</div>`;
                        return;
                    }

                    tasks.forEach(task => {
                        const div = document.createElement('div');
                        div.className = `flex items-center justify-between p-3.5 rounded-xl border transition ${task.completed ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-[#07090f] border-slate-800'}`;
                        
                        div.innerHTML = `
                            <div class="flex items-center space-x-3">
                                <button onclick="toggleTask('${task.id}', ${!task.completed})" class="w-5 h-5 rounded-lg border ${task.completed ? 'bg-emerald-500 border-emerald-400 text-black flex items-center justify-center font-bold text-xs' : 'border-slate-600 hover:border-red-500'} cursor-pointer transition">
                                    ${task.completed ? '✓' : ''}
                                </button>
                                <div>
                                    <h4 class="font-semibold text-xs sm:text-sm ${task.completed ? 'line-through text-slate-400' : 'text-white'}">${task.name}</h4>
                                    <span class="text-[10px] font-orbitron text-slate-500 uppercase">${task.frequency === 'sunday' ? '🗓️ Sunday Special' : '⚡ Daily'}</span>
                                </div>
                            </div>
                            <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1 transition cursor-pointer">🗑️</button>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (err) {
                console.error("Failed to load hygiene data:", err);
            }
        }

        async function toggleTask(taskId, completed) {
            const dateInput = document.getElementById('target-date').value;
            try {
                const res = await fetch(`/api/hygiene/${taskId}/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed, date: dateInput })
                });
                const data = await res.json();
                if (data.success) {
                    loadHygieneData();
                } else {
                    alert(data.error || "Action failed.");
                }
            } catch (err) {
                console.error("Toggle error:", err);
            }
        }

        async function addHygieneTask(e) {
            e.preventDefault();
            const name = document.getElementById('task-name').value;
            const frequency = document.getElementById('task-frequency').value;
            const password = prompt("Enter Action Password (Default: Jay#add@monster):");
            if (!password) return;

            try {
                const res = await fetch('/api/hygiene', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, frequency, password })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('task-name').value = '';
                    loadHygieneData();
                } else {
                    alert(data.error || "Unauthorized password.");
                }
            } catch (err) {
                console.error("Add task error:", err);
            }
        }

        async function deleteTask(taskId) {
            const password = prompt("Enter Action Password (Default: Jay#del@monster):");
            if (!password) return;

            try {
                const res = await fetch(`/api/hygiene/${taskId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    loadHygieneData();
                } else {
                    alert(data.error || "Unauthorized password.");
                }
            } catch (err) {
                console.error("Delete task error:", err);
            }
        }

        loadHygieneData();
    </script>
</body>
</html>
