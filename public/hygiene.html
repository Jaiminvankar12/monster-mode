<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONSTER MODE — Hygiene Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/dragon 1.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ef4444">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        body { background-color: #07090f; color: #f3f4f6; }
        .glass-card { background: linear-gradient(135deg, rgba(18, 22, 34, 0.75) 0%, rgba(10, 13, 20, 0.85) 100%); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hygiene-glow { box-shadow: 0 0 50px rgba(6, 182, 212, 0.2); }
        
        :root {
            --accent-primary: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.15);
        }
        .dynamic-accent { color: var(--accent-primary) !important; }
        .dynamic-bg { background-color: var(--accent-primary) !important; }
        .dynamic-border { border-color: var(--accent-primary) !important; }
        
        /* ✨ SMOOTH SCROLLING FOR ENTIRE WEB APP ✨ */
        html {
            scroll-behavior: smooth !important;
        }

        /* 🌌 CYBERPUNK ULTRA-SMOOTH THIN SCROLLBAR & FLOW (CYAN THEME) 🌌 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #07090f !important;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.4) !important;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.6), inset 0 0 5px rgba(239, 68, 68, 0.4) !important;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(239, 68, 68, 0.8) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9), inset 0 0 8px rgba(6, 182, 212, 0.8) !important;
        }

        /* 🔥 GLOWING PULSE ANIMATION FOR COMPLETED ITEMS 🔥 */
        @keyframes successGlow {
            0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2), inset 0 0 10px rgba(16, 185, 129, 0.1); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.5), inset 0 0 20px rgba(16, 185, 129, 0.3); }
            100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2), inset 0 0 10px rgba(16, 185, 129, 0.1); }
        }

        .completed-glow-anim {
            animation: successGlow 2.5s infinite ease-in-out;
            border-color: rgba(16, 185, 129, 0.6) !important;
            background-color: rgba(16, 185, 129, 0.05) !important;
        }

        /* 🚀 NEW: PHONEPE STYLE SUCCESS OVERLAY ANIMATION 🚀 */
        #successOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 47, 46, 0.9);
            backdrop-filter: blur(10px);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        #successOverlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .success-checkmark {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: #10b981;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #10b981;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .success-checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 4;
            stroke-miterlimit: 10;
            stroke: #10b981;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .success-checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #fff;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        @keyframes scale {
            0%, 100% { transform: none; }
            50% { transform: scale3d(1.1, 1.1, 1); }
        }
        @keyframes fill {
            100% { box-shadow: inset 0px 0px 0px 60px #10b981; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white overflow-x-hidden">

    <!-- 🚀 SUCCESS OVERLAY WIDGET -->
    <div id="successOverlay">
        <svg class="success-checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="success-checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="success-checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <h2 class="text-3xl font-black text-white mt-6 uppercase tracking-widest drop-shadow-[0_0_15px_rgba(16,185,129,0.8)]">Execution Complete</h2>
        <p class="text-emerald-300 font-bold tracking-widest mt-2 uppercase text-xs">Vector Synced Successfully</p>
    </div>

    <!-- Top Navigation Bar -->
    <header class="border-b border-white/5 bg-[#07090f]/90 backdrop-blur-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-cyan-600/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 font-black text-lg">🧼</div>
            <div>
                <h1 class="text-sm font-black tracking-wider uppercase text-white">MONSTER MODE <span class="text-cyan-400">HYGIENE</span></h1>
                <p class="text-[10px] text-zinc-400 font-semibold tracking-widest uppercase">Grooming & Vitality Matrix</p>
            </div>
        </div>
        <nav class="flex items-center gap-2 sm:gap-4 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 justify-start sm:justify-end scrollbar-none">
            <a href="dashboard.html" class="text-xs font-bold uppercase tracking-wider text-zinc-400 hover:text-white transition whitespace-nowrap">Dashboard</a>
            <button onclick="logoutUser()" class="text-xs font-bold uppercase tracking-wider bg-red-600/10 hover:bg-red-600 text-red-400 hover:text-white border border-red-600/30 px-3 sm:px-4 py-2 rounded-xl transition cursor-pointer whitespace-nowrap ml-2">Log Out</button>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-8 space-y-6">
        
        <!-- Hygiene Status Badge/Card -->
        <div class="bg-[#121520] border border-white/5 p-4 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl animate-pulse">✨</span>
                <div>
                    <h4 class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Grooming Status</h4>
                    <p id="hygieneStatusText" class="text-base font-black text-white">Loading Protocol...</p>
                </div>
            </div>
            <span id="xpBadge" class="text-[10px] text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3 py-1.5 rounded-xl uppercase font-bold">Level 1 Apex</span>
        </div>

        <!-- 🚀 UPDATED: FIXED HORIZONTAL IMAGE-1 STYLE DATE NAVIGATOR 🚀 -->
        <div class="glass-card hygiene-glow p-3 sm:p-5 rounded-2xl flex flex-row items-center justify-between gap-2 overflow-x-auto scrollbar-none w-full">
            <div class="flex items-center gap-2 shrink-0">
                <button type="button" onclick="shiftDate(-1)" class="px-3 sm:px-4 py-2 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded-xl text-xs font-extrabold uppercase tracking-wider transition cursor-pointer whitespace-nowrap">← Prev</button>
                <div class="text-center px-1 sm:px-2 min-w-[85px] shrink-0">
                    <span class="text-[9px] text-zinc-500 uppercase tracking-widest block font-bold">Viewing Date</span>
                    <span id="activeDateLabel" class="text-xs sm:text-sm font-black text-white tracking-wider whitespace-nowrap">2026-09-15</span>
                </div>
                <button type="button" onclick="shiftDate(1)" class="px-3 sm:px-4 py-2 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded-xl text-xs font-extrabold uppercase tracking-wider transition cursor-pointer whitespace-nowrap">Next →</button>
            </div>

            <input type="date" id="targetDateInput" value="2026-09-15" onchange="onDateChange()" class="hidden">

            <div id="hydrationStatusBadge" class="text-center px-3 sm:px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wider bg-zinc-900 text-zinc-300 border border-white/5 whitespace-nowrap shrink-0 ml-auto">
                Loading status...
            </div>
        </div>

        <!-- SECTION: HYGIENE TASKS MATRIX -->
        <div class="space-y-4">
            <div class="mt-2 mb-4 text-center">
                <span class="text-xs font-black tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Daily Vitality & Grooming</span>
                <h2 id="todayHeaderDate" class="text-lg sm:text-xl font-black uppercase text-white mt-3">Monday, September 15, 2026</h2>
            </div>

            <!-- Tasks Container -->
            <div id="hygieneTasksContainer" class="space-y-3">
                <p class="text-xs text-zinc-500 text-center py-10">Loading hygiene matrix...</p>
            </div>
        </div>

    </main>

    <script>
        function getLocalDateString() {
            return "2026-09-15";
        }

        let currentSelectedDate = getLocalDateString();
        const LAUNCH_DATE = "2026-09-15";

        async function fetchHygieneData(dateStr = "") {
            const todayStr = getLocalDateString();
            if (!dateStr) dateStr = todayStr;
            
            currentSelectedDate = dateStr;
            const dateInput = document.getElementById('targetDateInput');
            dateInput.value = dateStr;
            document.getElementById('activeDateLabel').innerText = dateInput.value;

            const dateObj = new Date(dateStr + 'T00:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('todayHeaderDate').innerText = dateObj.toLocaleDateString('en-US', options);

            try {
                const ts = new Date().getTime();
                const res = await fetch(`/api/hygiene?t=${ts}&date=${dateStr}`, { cache: 'no-store', credentials: 'include' });
                
                if (res.status === 401 || res.status === 403) {
                    if (localStorage.getItem('monster_admin_trusted') !== 'true') {
                        window.location.href = 'index.html';
                        return;
                    }
                }

                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        renderHygieneTasks(data.tasks || []);
                        document.getElementById('hygieneStatusText').innerText = data.allDone ? "All Protocols Met ✅" : "Execution Pending ⏳";
                        if (data.level) {
                            document.getElementById('xpBadge').innerText = `Level ${data.level} Apex (${data.xp} XP)`;
                        }
                        updateStatusBanner(data.dateStatus || 'UNLOCKED', dateInput.value);
                    }
                }
            } catch (err) {
                console.error("Cloud Connection Error:", err);
            }
        }

        function renderHygieneTasks(tasks) {
            const container = document.getElementById('hygieneTasksContainer');
            if (!tasks || tasks.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-8">No grooming protocols deployed yet.</p>`;
                return;
            }

            container.innerHTML = tasks.map(t => {
                const cardStyle = t.completed 
                    ? 'glass-card p-4 sm:p-5 rounded-2xl flex items-center justify-between gap-4 completed-glow-anim bg-emerald-500/10 transition-all duration-500' 
                    : 'glass-card p-4 sm:p-5 rounded-2xl flex items-center justify-between gap-4 border border-white/10 transition-all duration-500';

                return `
                <div class="${cardStyle}">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${t.frequency === 'sunday' ? '🌟' : '🧼'}</span>
                        <div>
                            <span class="text-[9px] text-cyan-400 uppercase font-bold tracking-widest block">${t.frequency || 'daily'}</span>
                            <h4 class="font-extrabold text-sm text-white mt-0.5">${t.name}</h4>
                        </div>
                    </div>
                    <button type="button" onclick="toggleHygiene('${t.id}', ${t.completed})" class="px-4 py-2.5 rounded-xl text-xs font-black uppercase transition shrink-0 ${t.completed ? 'bg-emerald-500/25 text-emerald-300 border border-emerald-500/40 shadow-lg' : 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-lg cursor-pointer'}">
                        ${t.completed ? 'DONE ✅' : 'DO IT'}
                    </button>
                </div>
            `;
            }).join('');
        }

        // 🚀 PLAY SUCCESS ANIMATION FUNCTION
        function playSuccessAnimation() {
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('active');
            
            // Re-trigger SVG animation cleanly
            const circle = overlay.querySelector('.success-checkmark__circle');
            const check = overlay.querySelector('.success-checkmark__check');
            circle.style.animation = 'none';
            check.style.animation = 'none';
            void circle.offsetWidth; // trigger reflow
            void check.offsetWidth;
            circle.style.animation = 'stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards';
            check.style.animation = 'stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards';

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 2500); // Overlay stays for 2.5 seconds before fading out
        }

        async function toggleHygiene(id, currentState) {
            const targetDate = document.getElementById('targetDateInput').value || currentSelectedDate;
            
            // TRIGGER OVERLAY IF WE ARE MARKING AS "DONE"
            if (!currentState) {
                 playSuccessAnimation();
            }

            try {
                const res = await fetch(`/api/hygiene/${id}/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ date: targetDate, completed: !currentState })
                });
                if (res.ok) {
                    fetchHygieneData(targetDate);
                }
            } catch (err) {
                alert("❌ Connection Error");
            }
        }

        function shiftDate(days) {
            const dateInput = document.getElementById('targetDateInput');
            let currentDate = new Date(dateInput.value || currentSelectedDate);
            currentDate.setDate(currentDate.getDate() + days);
            
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const day = String(currentDate.getDate()).padStart(2, '0');
            const newDateStr = `${year}-${month}-${day}`;

            dateInput.value = newDateStr;
            fetchHygieneData(newDateStr);
        }

        function onDateChange() {
            const chosenDate = document.getElementById('targetDateInput').value;
            if (chosenDate) {
                fetchHygieneData(chosenDate);
            }
        }

        function updateStatusBanner(status, targetDate) {
            const badge = document.getElementById('hydrationStatusBadge');
            const isPreLaunch = targetDate < LAUNCH_DATE;
            if (isPreLaunch) {
                badge.className = "text-center px-3 sm:px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wider bg-zinc-800 text-zinc-400 border border-zinc-700 whitespace-nowrap shrink-0 ml-auto";
                badge.innerText = "🔒 PRE-LAUNCH: Locked";
            } else {
                badge.className = "text-center px-3 sm:px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wider bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 whitespace-nowrap shrink-0 ml-auto";
                badge.innerText = "🟢 UNLOCKED — ACTIVE DAY";
            }
        }

        async function verifyGlobalSystemLock() {
            try {
                const ts = new Date().getTime();
                const res = await fetch('/api/system-lock?t=' + ts, { cache: 'no-store', credentials: 'include' });
                const data = await res.json();
                
                if (data.locked || data.hygieneLocked) {
                    const sessionRes = await fetch('/api/auth/session?t=' + ts, { cache: 'no-store', credentials: 'include' });
                    const sessionData = await sessionRes.json();
                    
                    if (sessionData.role !== 'ADMIN') {
                        document.body.innerHTML = `
                            <div class="fixed inset-0 bg-[#07090f] z-[99999] flex flex-col items-center justify-center p-6 text-center">
                                <div class="glass-card p-8 rounded-3xl border-2 border-red-500/50 max-w-xl w-full shadow-[0_0_40px_rgba(239,68,68,0.3)] space-y-4">
                                    <span class="text-5xl animate-bounce">🛡️</span>
                                    <h2 class="text-2xl font-black uppercase tracking-wider text-red-500">
                                        ${data.locked ? 'SYSTEM GLOBALLY LOCKED' : 'MODULE LOCKED BY ADMIN'}
                                    </h2>
                                    <p class="text-xs sm:text-sm text-slate-300 font-medium">
                                        This tracking sector has been securely locked by the administrator. All execution vectors and data are completely hidden.
                                    </p>
                                    <div class="text-xs bg-red-500/10 border border-red-500/20 text-red-400 py-3 px-4 rounded-xl font-bold uppercase tracking-widest">
                                        Access Denied / Contact Admin
                                    </div>
                                    <button type="button" onclick="window.location.href='index.html'" class="mt-4 px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-xs uppercase tracking-widest cursor-pointer transition">
                                        Return to Gateway
                                    </button>
                                </div>
                            </div>
                        `;
                        return;
                    }
                }
            } catch (err) {}
        }

        async function logoutUser() {
            try {
                localStorage.removeItem('monster_admin_trusted');
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            } catch(e) {}
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            verifyGlobalSystemLock();
            fetchHygieneData(getLocalDateString());
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCyberClick() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('button')) {
                playCyberClick();
            }
        });
    </script>
</body>
</html>
