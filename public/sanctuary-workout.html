<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONSTER MODE — Sanctuary Emergency Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        body { background-color: #07090f; color: #f3f4f6; }
        .glass-card { background: linear-gradient(135deg, rgba(18, 22, 34, 0.85) 0%, rgba(10, 13, 20, 0.95) 100%); backdrop-filter: blur(16px); border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-red-500 selection:text-white">

    <div class="max-w-xl w-full glass-card p-8 rounded-3xl space-y-6 shadow-[0_0_50px_rgba(239,68,68,0.2)]">
        <div class="text-center space-y-2">
            <span class="text-3xl animate-pulse">🛡️</span>
            <h2 class="text-2xl font-black uppercase tracking-wider text-red-500">Sanctuary Emergency Protocol</h2>
            <p class="text-xs text-slate-400">Regular trackers are frozen. Complete the physical core below to maintain momentum and freeze your study streak.</p>
        </div>

        <div id="sanctuaryTasks" class="space-y-3">
            <label class="flex items-center justify-between bg-[#030408] border border-white/10 p-4 rounded-2xl cursor-pointer hover:border-red-500/50 transition">
                <span class="font-bold text-sm text-white">💪 Pushups (3 Sets × 15 Reps)</span>
                <input type="checkbox" class="task-checkbox w-5 h-5 accent-red-500 cursor-pointer" onchange="checkAllSanctuaryDone()">
            </label>
            <label class="flex items-center justify-between bg-[#030408] border border-white/10 p-4 rounded-2xl cursor-pointer hover:border-red-500/50 transition">
                <span class="font-bold text-sm text-white">🦵 Bodyweight Squats (3 Sets × 20 Reps)</span>
                <input type="checkbox" class="task-checkbox w-5 h-5 accent-red-500 cursor-pointer" onchange="checkAllSanctuaryDone()">
            </label>
            <label class="flex items-center justify-between bg-[#030408] border border-white/10 p-4 rounded-2xl cursor-pointer hover:border-red-500/50 transition">
                <span class="font-bold text-sm text-white">⏱️ Forearm Plank (3 Sets × 60 Secs)</span>
                <input type="checkbox" class="task-checkbox w-5 h-5 accent-red-500 cursor-pointer" onchange="checkAllSanctuaryDone()">
            </label>
            <label class="flex items-center justify-between bg-[#030408] border border-white/10 p-4 rounded-2xl cursor-pointer hover:border-red-500/50 transition">
                <span class="font-bold text-sm text-white">🪑 Chair Triceps Dips (3 Sets × 12 Reps)</span>
                <input type="checkbox" class="task-checkbox w-5 h-5 accent-red-500 cursor-pointer" onchange="checkAllSanctuaryDone()">
            </label>
        </div>

        <button type="button" id="conquerBtn" onclick="completeSanctuaryWorkout()" disabled class="w-full py-4 bg-zinc-800 text-zinc-500 font-black rounded-2xl text-xs uppercase tracking-widest cursor-not-allowed transition shadow-lg">
            Complete All Exercises First
        </button>
    </div>

    <script>
        function checkAllSanctuaryDone() {
            const checkboxes = document.querySelectorAll('.task-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            const btn = document.getElementById('conquerBtn');
            
            if (allChecked) {
                btn.disabled = false;
                btn.className = "w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-2xl text-xs uppercase tracking-widest cursor-pointer transition shadow-lg shadow-emerald-600/30";
                btn.innerText = "⚡ Conquer Sanctuary & Freeze Study Streak";
            } else {
                btn.disabled = true;
                btn.className = "w-full py-4 bg-zinc-800 text-zinc-500 font-black rounded-2xl text-xs uppercase tracking-widest cursor-not-allowed transition shadow-lg";
                btn.innerText = "Complete All Exercises First";
            }
        }

        async function completeSanctuaryWorkout() {
            try {
                const res = await fetch('/api/sanctuary/complete-workout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ completed: true })
                });
                if (res.ok) {
                    alert("⚡ Sanctuary Protocol Completed Successfully! Study Streak Protected.");
                    window.location.href = 'dashboard.html';
                } else {
                    alert("❌ Failed to sync completion.");
                }
            } catch (err) {
                alert("❌ Connection error");
            }
        }
    </script>
</body>
</html>
